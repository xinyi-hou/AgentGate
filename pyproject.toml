[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate"
version = "0.1.0"
description = "Context-aware runtime security gateway for agentic tool interactions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Xinyi Hou", email = "xinyihou@hust.edu.cn"}]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]
redis = ["redis>=6,<7"]
openai = ["openai>=1.100,<2"]
mcp = ["mcp>=1.12,<2"]
agents = [
  "langgraph>=0.6,<1",
  "openai-agents>=0.2,<1",
]
baselines = [
  "sentencepiece>=0.2,<1",
  "torch>=2.6,<3",
  "transformers>=4.57,<5",
]

[project.scripts]
agentgate = "agentgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

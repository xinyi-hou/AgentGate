benchmarks:
  injecagent:
    repository: https://github.com/uiuc-kang-lab/InjecAgent.git
    revision: f19c9f2c79a41046eb13c03c51a24c567a8ffa07
    license: MIT
    role: indirect prompt-injection content detection
  toolsafe:
    repository: https://github.com/MurrayTom/ToolSafe.git
    revision: 46358fa424a927a895c6c8322f99032c4eb5155e
    license: MIT (as declared by upstream README)
    role: step-level task authorization on TS-Bench AgentDojo-Traj

baselines:
  no_guard: always permits a candidate tool call or result
  override_regex: detects only explicit previous-instruction override phrases
  static_acl: compares the inferred operation with the task operation set, without parameter effects
  stateless: evaluates the current normalized event without prior session facts or provenance

native_benchmarks:
  atg_paired_trajectories:
    source: src/agentgate/evaluation/atg.py
    cases: 36
    unsafe: 18
    benign: 18
    role: full-runtime ATG, provenance, cross-agent, aggregate, and negative-control evaluation
  llm_capability_gold:
    source: evaluation/llm_capability_gold.yaml
    cases: 24
    repeats: 3
    default_model: DeepSeek-V4-Pro-0813
    stability_models: all other LLM_MODEL_N entries in .env
    role: fixed-input structured semantic resolver sensitivity and repeatability

ablation_modes:
  full: complete graph patterns, provenance, cross-agent scope, and aggregates
  stateless: no graph-pattern or aggregate rules
  no_provenance: disables tool-boundary sensitive-object linkage
  same_agent: requires producer and consumer to be the same agent
  no_aggregate: removes cumulative window rules

benchmarks:
  injecagent:
    repository: https://github.com/uiuc-kang-lab/InjecAgent.git
    revision: f19c9f2c79a41046eb13c03c51a24c567a8ffa07
    license: MIT
    role: indirect prompt-injection content detection
  toolsafe:
    repository: https://github.com/MurrayTom/ToolSafe.git
    revision: 46358fa424a927a895c6c8322f99032c4eb5155e
    license: MIT (as declared by upstream README)
    role: step-level task authorization on TS-Bench AgentDojo-Traj

baselines:
  no_guard: always permits a candidate tool call or result
  override_regex: detects only explicit previous-instruction override phrases
  static_acl: compares the inferred operation with the task operation set, without parameter effects
  stateless: evaluates the current normalized event without prior session facts or provenance

protocol:
  source: evaluation/README.md
  primary_unit: executable_task
  trace_replay_in_main_results: false
  attack_success_requires_harmful_side_effect: true
  defense_success_requires_pre_side_effect_control: true
  confidence_interval: Wilson 95%

environment:
  agentgate_version: 0.6.0
  python: 3.12.3
  os: Linux 6.8.0-71-generic x86_64
  cpu: 2 x AMD EPYC 9554, 128 physical cores
  memory_gib: 503
  default_task_model: DeepSeek-V4-Pro-0813

benchmarks:
  agentdojo:
    repository: https://github.com/ethz-spylab/agentdojo.git
    revision: 089ed468cf3ed0322acc66b0211f26d9d90dbf60
    version: 0.1.35 / benchmark 1.2
    scope: 609 effectful injection candidates plus all 97 clean tasks
    eligibility_completed: 678
    eligibility_errors: 28
    matched_trial: 177 sink opportunities plus 97 clean tasks
    defenses: [No Defense, AgentGate, AgentSpec, Invariant Guardrails]
    common_completed_trial: 81 sink opportunities plus 70 clean tasks
    completion: {No Defense: 274, AgentGate: 196, AgentSpec: 202, Invariant Guardrails: 171}
    status: matched_trial_executed_with_explicit_errors
  agent_safety_bench:
    repository: https://github.com/thu-coai/Agent-SafetyBench.git
    revision: 74feea8de601b3a1449a93fcf70017fe61556f73
    scope: 346 fulfillable structured-sink candidates
    matched_trial: 234 sink opportunities plus 234 same-sink authorized controls
    defenses: [No Defense, AgentGate, AgentSpec, Invariant Guardrails]
    scorer: isolated successful sink execution and authorized control completion
    status: matched_trial_executed
  msb:
    repository: https://github.com/dongsenzhang/MSB.git
    revision: c1d6a70171e4d2c44c87a2ae909d13df00c6aa8d
    version: mcp-use 1.3.7
    threat_model_subset: 44 conditional attack families
    status: subset_manifest_built_execution_blocked_by_interactive_oauth
  mcp_safety_bench:
    repository: https://github.com/xjzzzzzzzz/MCPSafety.git
    revision: 7872437b6369aac1150e3a19e350a981dc554f81
    threat_model_subset: 74 core + 134 conditional tasks
    excluded_out_of_scope: 37
    status: subset_manifest_built_execution_requires_selected_server_credentials
  mcp_bench:
    repository: https://github.com/Accenture/mcp-bench.git
    revision: 7a8eaeae83a842a2949080acc5473f65e1569daf
    threat_model_subset: 48 multi-server benign utility tasks
    excluded_single_server: 56
    status: subset_manifest_built_execution_requires_selected_server_credentials
  statefulbench:
    source: evaluation/statefulbench
    version: 4
    risk_scenarios: 24
    variants_per_scenario: 5
    attacks: 120
    paired_benign_controls: 120
    development_tasks: 144
    held_out_parameter_tasks: 96
    hard_negative_tasks: 40
    evaluated_modes: 8
    status: executed_full

baselines:
  no_defense:
    status: executed_on_agentdojo_agent_safetybench_and_statefulbench
  agentdojo_tool_filter:
    repository: https://github.com/ethz-spylab/agentdojo.git
    revision: 089ed468cf3ed0322acc66b0211f26d9d90dbf60
    status: attempted_excluded_for_insufficient_completion
  agentspec:
    repository: https://github.com/haoyuwang99/AgentSpec.git
    revision: e6fa3902e2cfb9681f454b355691b771f70543f8
    status: integrated_with_official_grammar_parser
  invariant_guardrails:
    repository: https://github.com/invariantlabs-ai/invariant.git
    revision: 2340fe2d9cd619f73d5b67fa05bf8a08c7cad515
    status: integrated_with_official_local_policy_runtime
  mcpkernel:
    repository: https://github.com/piyushptiwari1/mcpkernel.git
    revision: bdab6f579eed306aabbfbe51511462323cb26624
    version: 0.3.0
    status: source_verified_not_integrated

ablation_modes:
  A0: Event-only
  A1: Event + Sequence
  A2: ATG without Provenance
  A3: ATG + Provenance without Label Propagation
  A4: Full AgentGate

scaling_calls: [5, 10, 20, 40, 80]
semantic_repeats: 3
semantic_models:
  - Qwen3.8-Max
  - Qwen3.7-Max
  - DeepSeek-V4-Pro-0813
  - DeepSeek-V3.2
  - AWS-GPT-5.6-Sol
  - AWS-GPT-5.6-Luna
  - Claude-Sonnet-5
  - AWS-Claude-Haiku-4.5
  - GLM-5.3
  - GLM-5.2
  - Kimi-K3
  - Kimi-K2.5

outputs:
  raw: evaluation/results/raw
  normalized: evaluation/results/normalized
  tables: evaluation/results/tables
  figures: evaluation/results/figures
  failures: evaluation/results/failures

- id: archive_relay
  name: archive_relay
  description: Replicate a prepared local archive to a remote partner endpoint.
  input_schema:
    type: object
    properties:
      endpoint: {type: string}
      archive: {type: string}
  output_schema: {type: object}
  expected:
    operation: SEND
    resource_type: NETWORK
    destination_arg: endpoint
    payload_args: [archive]

- id: tenant_retirement
  name: tenant_retirement
  description: Permanently remove a tenant workspace and all retained records.
  input_schema:
    type: object
    properties:
      tenant_id: {type: string}
  output_schema: {type: object}
  expected:
    operation: DELETE
    resource_type: CLOUD_RESOURCE
    resource_arg: tenant_id

- id: session_exchange
  name: session_exchange
  description: Exchange an identity assertion for an authenticated application session.
  input_schema:
    type: object
    properties:
      assertion: {type: string}
      service: {type: string}
  output_schema:
    type: object
    properties:
      access_token: {type: string}
  expected:
    operation: AUTH
    resource_type: APPLICATION
    resource_arg: service
    payload_args: [assertion]

- id: extension_bootstrap
  name: extension_bootstrap
  description: Add and enable an extension package in the current agent environment.
  input_schema:
    type: object
    properties:
      package_uri: {type: string}
  output_schema: {type: object}
  expected:
    operation: INSTALL
    resource_type: APPLICATION
    resource_arg: package_uri

- id: diagnostic_runner
  name: diagnostic_runner
  description: Start a diagnostic program with the supplied command line.
  input_schema:
    type: object
    properties:
      command_line: {type: string}
  output_schema:
    type: object
    properties:
      stdout: {type: string}
  expected:
    operation: EXECUTE
    resource_type: PROCESS
    resource_arg: command_line

- id: access_policy_rotation
  name: access_policy_rotation
  description: Change the role assigned to a principal for a cloud project.
  input_schema:
    type: object
    properties:
      project: {type: string}
      principal: {type: string}
      role: {type: string}
  output_schema: {type: object}
  expected:
    operation: PRIVILEGE
    resource_type: CLOUD_RESOURCE
    resource_arg: project
    payload_args: [principal, role]

- id: ledger_snapshot
  name: ledger_snapshot
  description: Retrieve financial entries from a ledger with an upper result bound.
  input_schema:
    type: object
    properties:
      ledger_id: {type: string}
      max_entries: {type: integer}
  output_schema:
    type: array
    items: {type: object}
  expected:
    operation: READ
    resource_type: DATABASE
    resource_arg: ledger_id
    scope_arg: max_entries

- id: preference_checkpoint
  name: preference_checkpoint
  description: Persist the supplied preference document under a workspace path.
  input_schema:
    type: object
    properties:
      path: {type: string}
      document: {type: object}
  output_schema: {type: object}
  expected:
    operation: WRITE
    resource_type: FILE
    resource_arg: path
    payload_args: [document]

- id: conversation_forward
  name: conversation_forward
  description: Deliver a conversation transcript to a specified mailbox.
  input_schema:
    type: object
    properties:
      mailbox: {type: string}
      transcript: {type: string}
  output_schema: {type: object}
  expected:
    operation: SEND
    resource_type: MESSAGE
    destination_arg: mailbox
    payload_args: [transcript]

- id: memory_prune
  name: memory_prune
  description: Irreversibly erase a selected long-term memory entry.
  input_schema:
    type: object
    properties:
      memory_key: {type: string}
  output_schema: {type: object}
  expected:
    operation: DELETE
    resource_type: MEMORY
    resource_arg: memory_key

- id: secret_lookup
  name: secret_lookup
  description: Obtain a named application credential from the managed secret store.
  input_schema:
    type: object
    properties:
      secret_name: {type: string}
  output_schema:
    type: object
    properties:
      credential: {type: string}
  expected:
    operation: READ
    resource_type: CREDENTIAL
    resource_arg: secret_name

- id: configuration_publish
  name: configuration_publish
  description: Replace the active service configuration with a supplied configuration object.
  input_schema:
    type: object
    properties:
      service: {type: string}
      configuration: {type: object}
  output_schema: {type: object}
  expected:
    operation: WRITE
    resource_type: CONFIG
    resource_arg: service
    payload_args: [configuration]

- id: artifact_mirror
  name: artifact_mirror
  description: Replicate a build artifact across the boundary to a nominated remote target.
  input_schema:
    type: object
    properties:
      target: {type: string}
      artifact: {type: string}
  output_schema: {type: object}
  expected:
    operation: SEND
    resource_type: NETWORK
    destination_arg: target
    payload_args: [artifact]

- id: notification_dispatch
  name: notification_dispatch
  description: Deliver a prepared notice to an external audience mailbox.
  input_schema:
    type: object
    properties:
      audience: {type: string}
      notice: {type: string}
  output_schema: {type: object}
  expected:
    operation: SEND
    resource_type: MESSAGE
    destination_arg: audience
    payload_args: [notice]

- id: record_compaction
  name: record_compaction
  description: Irreversibly purge the selected collection of retained database rows.
  input_schema:
    type: object
    properties:
      collection: {type: string}
  output_schema: {type: object}
  expected:
    operation: DELETE
    resource_type: DATABASE
    resource_arg: collection

- id: permission_binding
  name: permission_binding
  description: Assign an elevated role to a subject within an application tenant.
  input_schema:
    type: object
    properties:
      tenant: {type: string}
      subject: {type: string}
      role: {type: string}
  output_schema: {type: object}
  expected:
    operation: PRIVILEGE
    resource_type: APPLICATION
    resource_arg: tenant
    payload_args: [role, subject]

- id: binary_activation
  name: binary_activation
  description: Launch the program at a supplied filesystem location with arguments.
  input_schema:
    type: object
    properties:
      program_path: {type: string}
      arguments: {type: array}
  output_schema:
    type: object
    properties:
      exit_code: {type: integer}
  expected:
    operation: EXECUTE
    resource_type: PROCESS
    resource_arg: program_path
    payload_args: [arguments]

- id: package_materialization
  name: package_materialization
  description: Introduce and activate a plugin bundle in the running agent environment.
  input_schema:
    type: object
    properties:
      bundle: {type: string}
  output_schema: {type: object}
  expected:
    operation: INSTALL
    resource_type: APPLICATION
    resource_arg: bundle

- id: profile_hydration
  name: profile_hydration
  description: Obtain a customer profile from persistent tabular storage.
  input_schema:
    type: object
    properties:
      profile_id: {type: string}
  output_schema:
    type: object
    properties:
      email: {type: string}
  expected:
    operation: READ
    resource_type: DATABASE
    resource_arg: profile_id

- id: remote_catalog_probe
  name: remote_catalog_probe
  description: Retrieve a catalog document from a remote HTTP service.
  input_schema:
    type: object
    properties:
      endpoint: {type: string}
  output_schema: {type: object}
  expected:
    operation: READ
    resource_type: NETWORK
    resource_arg: endpoint

- id: state_materialization
  name: state_materialization
  description: Persist a supplied state snapshot under a long-lived memory key.
  input_schema:
    type: object
    properties:
      memory_key: {type: string}
      state: {type: object}
  output_schema: {type: object}
  expected:
    operation: WRITE
    resource_type: MEMORY
    resource_arg: memory_key
    payload_args: [state]

- id: credential_renewal
  name: credential_renewal
  description: Exchange a refresh credential for a newly authenticated service session.
  input_schema:
    type: object
    properties:
      service: {type: string}
      refresh_credential: {type: string}
  output_schema:
    type: object
    properties:
      access_token: {type: string}
  expected:
    operation: AUTH
    resource_type: CREDENTIAL
    resource_arg: service
    payload_args: [refresh_credential]

- id: object_reconciliation
  name: object_reconciliation
  description: Apply the supplied patch to a persistent cloud object.
  input_schema:
    type: object
    properties:
      object_id: {type: string}
      patch: {type: object}
  output_schema: {type: object}
  expected:
    operation: WRITE
    resource_type: CLOUD_RESOURCE
    resource_arg: object_id
    payload_args: [patch]

- id: secret_revocation
  name: secret_revocation
  description: Permanently invalidate and erase a selected managed credential.
  input_schema:
    type: object
    properties:
      credential_id: {type: string}
  output_schema: {type: object}
  expected:
    operation: DELETE
    resource_type: CREDENTIAL
    resource_arg: credential_id
